# KEYSTONE_TV_v1 - the Apple TV scoreboard app (its own small project; the dialler's project is untouched).
# cd TV && xcodegen generate
name: KeystoneTV
options:
  bundleIdPrefix: com.keystonecrm
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    SWIFT_VERSION: "5.0"
configFiles:
  Debug: Config/TV.xcconfig
  Release: Config/TV.xcconfig
schemes:
  KeystoneTV:
    build:
      targets:
        KeystoneTV: all
        KeystoneTVTests: [test]
    test:
      targets:
        - KeystoneTVTests
targets:
  KeystoneTV:
    type: application
    platform: tvOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KS_TV_BUNDLE_ID)
        PRODUCT_NAME: KeystoneTV
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
  KeystoneTVTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - Tests
    dependencies:
      - target: KeystoneTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KS_TV_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/KeystoneTV.app/KeystoneTV
        BUNDLE_LOADER: $(TEST_HOST)
