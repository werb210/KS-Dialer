# v815_IOS_UPLOAD - builds the iPhone dialer (with its Apple Watch app and extensions) in the cloud and
# uploads it to App Store Connect (TestFlight), so no Mac or Xcode is needed. Run it by hand: GitHub > Actions >
# "Upload iOS build" > Run workflow. It never runs on its own. Signing uses the team set as DEVELOPMENT_TEAM in
# Config/Keystone.xcconfig (KEYSTONE_CONFIG_v1) through an App Store Connect API key kept in the repo secrets
# ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 (the full text of the .p8 file). Each run gets a new build number (1000 + run number) for every target. The build
# appears in TestFlight after Apple processes it, usually 10-30 minutes.
name: Upload iOS build
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What changed (shown in the run summary only)"
        required: false
        default: ""
concurrency:
  group: ios-upload
  cancel-in-progress: false
jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Check the App Store Connect key is set up
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi
      - name: Pick the build number (1000 + run number)
        run: echo "BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      # KEYSTONE_CONFIG_v1 - the team comes from Config/Keystone.xcconfig, the one place the app's identity is set.
      - name: Read the signing team from Config/Keystone.xcconfig
        run: |
          team="$(sed -n 's/^DEVELOPMENT_TEAM[[:space:]]*=[[:space:]]*\([A-Z0-9]*\).*/\1/p' Config/Keystone.xcconfig | head -n1)"
          if [ -z "$team" ]; then
            echo "::error::Set DEVELOPMENT_TEAM in Config/Keystone.xcconfig (see README, Keystone setup)"
            exit 1
          fi
          echo "TEAM_ID=$team" >> "$GITHUB_ENV"
          plutil -replace teamID -string "$team" Config/ci/ExportOptions.plist
      - name: Use the newest released Xcode (App Store Connect refuses beta builds)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Install the App Store Connect key
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
      # v833_CERT_CLEANUP - each cloud run makes Xcode create an "Apple Development" certificate ("Created via
      # API") and Apple allows only a few, so archiving started failing. This deletes the leftover API-made development
      # certificates from earlier runs (older than 75 minutes) and nothing else: the Distribution Managed certificate,
      # people's own development certificates and the VoIP certificates are kept.
      # It never fails the run.
      - name: Delete leftover cloud development certificates
        continue-on-error: true
        run: node scripts/asc-cleanup-dev-certs.mjs
      - name: Archive (signed with the company team)
        run: >-
          xcodebuild archive
          -project BorealDialer.xcodeproj
          -scheme BorealDialer
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/BorealDialer.xcarchive"
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          -authenticationKeyID "$ASC_KEY_ID"
          -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          DEVELOPMENT_TEAM="$TEAM_ID"
          CODE_SIGN_STYLE=Automatic
          CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
      - name: Upload to App Store Connect
        run: >-
          xcodebuild -exportArchive
          -archivePath "$RUNNER_TEMP/BorealDialer.xcarchive"
          -exportOptionsPlist Config/ci/ExportOptions.plist
          -exportPath "$RUNNER_TEMP/export"
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          -authenticationKeyID "$ASC_KEY_ID"
          -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Summary
        if: success()
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          {
            echo "### Uploaded to App Store Connect (TestFlight)"
            echo "- App: KS-Dialer (iPhone + Apple Watch), team $TEAM_ID"
            echo "- Build number: $BUILD_NUMBER"
            echo "- Notes: ${NOTES:-none}"
            echo "Apple processes the build for 10-30 minutes, then it appears in TestFlight."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
